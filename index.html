<style>
:root{--bg:#030818;--navy:#071346;--blue:#12308f;--ice:#d3ddff;--text:#e6ebff;--muted:#8d99c8;--gold:#d8b35c;--line:rgba(255,255,255,.15);--glass:rgba(255,255,255,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Jost','Segoe UI',Arial,sans-serif;font-weight:300;color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1180px,92%);margin:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.thin{font-weight:200;color:var(--ice);margin:0;line-height:1.02;letter-spacing:.02em}

.pill{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:999px;background:var(--gold);color:#12100a;font-weight:500;font-size:15px;border:1px solid var(--gold);cursor:pointer;transition:background .25s,color .25s}
.pill:hover{background:transparent;color:var(--gold)}
.pill.ghost{background:transparent;color:var(--text);border-color:rgba(255,255,255,.4)}
.pill.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* nav */
.nav{position:absolute;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:20px 4vw}
.logo{justify-self:start;background:#fff;border-radius:16px;padding:6px 14px}
.logo img{height:58px;width:auto}
.nav nav{display:flex;gap:34px;font-size:16px}
.nav nav a{color:#c3cdf5}.nav nav a:hover{color:var(--gold)}
.nav .pill{justify-self:end}

/* hero */
.hero{position:relative;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 62% 40%,var(--blue) 0,var(--navy) 42%,var(--bg) 100%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,var(--bg),transparent);z-index:2;pointer-events:none}
.kaaba{position:absolute;bottom:0;right:13vw;height:94%;width:auto;max-width:none;z-index:1;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;-webkit-mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent)}
.herotext{position:absolute;z-index:3;left:5vw;top:50%;transform:translateY(-52%);max-width:min(640px,52vw)}
.herotext h1{font-size:clamp(76px,13.5vw,220px);letter-spacing:.05em;margin-left:-.04em}
.herotext p{margin:22px 0 30px;max-width:400px;line-height:1.65;font-size:18px;color:#b7c2ee}
.heroactions{display:flex;gap:14px;flex-wrap:wrap}
.badge{position:absolute;z-index:3;right:4vw;top:46%;transform:translateY(-50%);width:170px;height:170px;border-radius:50%;border:1px solid var(--gold);display:grid;place-content:center;text-align:center;background:rgba(3,8,24,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
